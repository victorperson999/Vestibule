[project]
name = "vestibule-mcp"
version = "0.1.1"
description = "A local, kernel-isolated code-execution sandbox for AI agents, exposed as an MCP server."
readme = "PYPI.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor" }]
keywords = ["mcp", "sandbox", "ai-agents", "code-execution", "security", "isolation"]
# Only what the gates and the release smoke actually ran (M4 F1).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    # The minor both gates ran (M4 P2). Move it with requirements/constraints.txt. mcp 2.x
    # replaced the low-level Server API, and that move is its own milestone (docs/BUILD_LOG.md).
    "mcp>=1.30.0,<1.31",
]

[project.urls]
Homepage = "https://github.com/victorperson999/Vestibule"
Issues = "https://github.com/victorperson999/Vestibule/issues"

[project.optional-dependencies]
# M2 step 5 (N4): seccomp is now a required hard control for native isolation, via our own
# ctypes binding over the system libseccomp.so.2 — not an optional `pyseccomp` extra.
# Ranges for users; exact versions for development live in requirements/constraints.txt.
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.15.20,<0.16", "mypy>=2.1,<2.2"]

[project.scripts]
vestibule-mcp = "vestibule.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vestibule"]

[tool.hatch.build.targets.sdist]
# Explicit: a build otherwise ships everything git doesn't ignore (M4 F2).
include = ["/src/vestibule", "/README.md", "/PYPI.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# Check against the oldest supported Python on every platform: Linux-only code runs on a
# newer interpreter here and must not use stdlib APIs 3.11 lacks.
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "docker: needs a running Docker daemon and both digest-pinned sandbox images; skips (with the pull commands) otherwise",
    "network: fetches the pinned images from their registry (Linux; about 123 MB per session)",
    "native: runs native sandboxes (Linux, user namespaces, and the trees `vestibule-mcp setup` makes); skips with the reason otherwise",
]

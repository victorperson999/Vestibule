[project]
name = "vestibule-mcp"
version = "0.0.1"
description = "A local, kernel-isolated code-execution sandbox for AI agents, exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor" }]
keywords = ["mcp", "sandbox", "ai-agents", "code-execution", "security", "isolation"]
dependencies = [
    # <2: mcp 2.x replaced the low-level Server API this server is written against.
    # Moving to 2.x is a planned task (docs/BUILD_LOG.md known issues).
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
# M2 step 5 (N4): seccomp is now a required hard control for native isolation, via our own
# ctypes binding over the system libseccomp.so.2 — not an optional `pyseccomp` extra.
# Ranges for users; exact versions for development live in requirements/constraints.txt.
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.15.20,<0.16", "mypy>=2.1,<2.2"]

[project.scripts]
vestibule-mcp = "vestibule.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vestibule"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# Check against the oldest supported Python on every platform: Linux-only code runs on a
# newer interpreter here and must not use stdlib APIs 3.11 lacks.
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "docker: needs a running Docker daemon and both digest-pinned sandbox images; skips (with the pull commands) otherwise",
    "network: fetches the pinned images from their registry (Linux; about 123 MB per session)",
    "native: runs native sandboxes (Linux, user namespaces, and the trees `vestibule-mcp setup` makes); skips with the reason otherwise",
]
